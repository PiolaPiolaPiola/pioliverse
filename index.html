<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pioliverse · Alejandra Bedoya León</title>
    <meta name="description" content="Portafolio de Alejandra Bedoya León, Backend .NET Developer. APIs RESTful, C#, .NET y SQL Server." />
    <meta property="og:title" content="Pioliverse · Alejandra Bedoya León" />
    <meta property="og:description" content="Backend .NET Developer · APIs, automatización y datos que vuelan." />
    <meta name="theme-color" content="#5C8F02" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema y el idioma guardados antes de pintar para evitar parpadeos.
      (function () {
        try {
          var t = localStorage.getItem('pv-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('pv-lang');
          if (l === 'es' || l === 'en') document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
